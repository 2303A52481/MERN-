<!DOCTYPE html>
<html>
    <head>
        <title>Box Model</title>
        <style>
            #container {
                padding: 20px;
                margin: 20px;
                background-color: lightblue;
                display: flex;
                flex-wrap: wrap;
            }
            .item {
                width: 150px;
                margin: 10px;
                padding: 10px;
                border: 1px solid black;
                background-color: white;
                overflow-wrap: break-word;
                word-wrap: break-word;
            }
            h2 {
                margin: 0 0 10px;
                font-size: 16px;
                position: static;
            }
            p {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div class="item"><h2>Box 1</h2><p>Content</p></div>
            <div class="item"><h2>Box 2</h2><p>Content</p></div>
            <div class="item"><h2>Box 3</h2><p>Content</p></div>
            <div class="item"><h2>Box 4</h2><p>Content</p></div>
            <div class="item"><h2>Box 5</h2><p>Content</p></div>
            <div class="item"><h2>Box 6</h2><p>Content</p></div>
        </div>
    </body>
</html>
