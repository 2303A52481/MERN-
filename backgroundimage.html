<!DOCTYPE html>
<html>
    <head>
        <title>Background Image</title>
        <style>
            #center{
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
            }
            body{
                background-image: url('./Images/backgroundimage.jpg');
                background-size: cover;
            }
            h1{
                height:100px;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
        </style>
    </head>
    <body>
        <h1>Google</h1>
        <div id="center">
            <h1>Google</h1>
        </div>
    </body>
</html>
