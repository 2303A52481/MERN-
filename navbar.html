<!DOCTYPE html>
<html>
    <head>

        <style>
            #navbar{

                list-style-type:none;
                justify-content: center;

            <h1>Portfolio</h1>
            <ul id="navlist">

                <li class="item">Contact</li>
            </ul>

        </div>
