<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Box Model</title>
        <style>
            .box{
                height:200px;
                width:200px;
                border:2px solid rgb(93, 103, 214);
                background:linear-gradient(to right, rgb(93, 103, 214), rgb(255, 255, 255), rgb(205, 153, 11));
                padding:10px 10px 10px 10px;
                margin:10px 10px 10px 10px;
            }
            .profile{
                height:200px;
                width:200px;
                background:linear-gradient(to right, rgb(156, 220, 177), rgb(64, 179, 22), rgb(133, 188, 119));
                border:2px solid rgb(93, 103, 214);
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>Box Model</h1>
            <p>The CSS box model is a fundamental concept in web design and development that describes how elements on a web page are structured and how they interact with each other. It consists of several components that define the layout and spacing of elements:</p>
            <div class="box">Box1</div>
            <div class="box">Box2</div>
            <div class="box">Box3</div>
            <h1>Profile</h1>
            <div class="profile">Profile</div>

        </div>
    </body>
</html>
